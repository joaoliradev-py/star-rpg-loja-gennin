<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Filtro de sombra e relevo -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
        </filter>

        <!-- Gradientes metálicos para as facetas iluminadas e sombreadas -->
        <linearGradient id="metal-light-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="40%" stop-color="#cbd5e1"/>
            <stop offset="80%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#64748b"/>
        </linearGradient>

        <linearGradient id="metal-light-2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="50%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#475569"/>
        </linearGradient>

        <linearGradient id="metal-dark-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#475569"/>
            <stop offset="50%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>

        <linearGradient id="metal-dark-2" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#090d16"/>
            <stop offset="60%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#334155"/>
        </linearGradient>

        <linearGradient id="metal-edge" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="50%" stop-color="#94a3b8"/>
            <stop offset="100%" stop-color="#334155"/>
        </linearGradient>

        <!-- Gradiente do anel central -->
        <radialGradient id="ring-metal" cx="45%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="45%" stop-color="#94a3b8"/>
            <stop offset="80%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </radialGradient>
        
        <linearGradient id="ring-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
        </linearGradient>
    </defs>

    <g filter="url(#shadow)">
        <!-- Corpo da Shuriken - 8 Facetas Metálicas 3D -->
        
        <!-- Ponta Norte - Lado Esquerdo (Iluminado) -->
        <path d="M 256,256 L 256,24 Q 218,118 178,178 Z" fill="url(#metal-light-1)" stroke="#334155" stroke-width="1"/>
        
        <!-- Ponta Norte - Lado Direito (Meia-luz) -->
        <path d="M 256,256 L 256,24 Q 294,118 334,178 Z" fill="url(#metal-light-2)" stroke="#1e293b" stroke-width="1"/>

        <!-- Ponta Leste - Lado Superior (Iluminado) -->
        <path d="M 256,256 L 488,256 Q 394,218 334,178 Z" fill="url(#metal-light-1)" stroke="#334155" stroke-width="1"/>

        <!-- Ponta Leste - Lado Inferior (Sombra) -->
        <path d="M 256,256 L 488,256 Q 394,294 334,334 Z" fill="url(#metal-dark-1)" stroke="#0f172a" stroke-width="1"/>

        <!-- Ponta Sul - Lado Direito (Sombra Intensa) -->
        <path d="M 256,256 L 256,488 Q 294,394 334,334 Z" fill="url(#metal-dark-2)" stroke="#090d16" stroke-width="1"/>

        <!-- Ponta Sul - Lado Esquerdo (Sombra) -->
        <path d="M 256,256 L 256,488 Q 218,394 178,334 Z" fill="url(#metal-dark-1)" stroke="#1e293b" stroke-width="1"/>

        <!-- Ponta Oeste - Lado Inferior (Meia-sombra) -->
        <path d="M 256,256 L 24,256 Q 118,294 178,334 Z" fill="url(#metal-dark-2)" stroke="#1e293b" stroke-width="1"/>

        <!-- Ponta Oeste - Lado Superior (Luz Direta) -->
        <path d="M 256,256 L 24,256 Q 118,218 178,178 Z" fill="url(#metal-light-2)" stroke="#475569" stroke-width="1"/>

        <!-- Linhas de fio da lâmina (Cume Afiado) -->
        <line x1="256" y1="24" x2="256" y2="256" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
        <line x1="488" y1="256" x2="256" y2="256" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
        <line x1="256" y1="488" x2="256" y2="256" stroke="#475569" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
        <line x1="24" y1="256" x2="256" y2="256" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

        <!-- Fio externo das lâminas afiadas -->
        <path d="M 256,24 Q 294,118 334,178 Q 394,218 488,256 Q 394,294 334,334 Q 294,394 256,488 Q 218,394 178,334 Q 118,294 24,256 Q 118,218 178,178 Q 218,118 256,24 Z" 
              fill="none" stroke="url(#ring-bevel)" stroke-width="2.5"/>

        <!-- Anel Central Metálico Ninja (com furo vazado) -->
        <circle cx="256" cy="256" r="62" fill="url(#ring-metal)" stroke="#0f172a" stroke-width="2"/>
        <circle cx="256" cy="256" r="61" fill="none" stroke="url(#ring-bevel)" stroke-width="2"/>
        
        <!-- Furo central vazado com borda chanfrada de profundidade -->
        <circle cx="256" cy="256" r="34" fill="#0f172a"/>
        <circle cx="256" cy="256" r="32" fill="#000000"/>
        <circle cx="256" cy="256" r="33" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.8"/>
    </g>
</svg>
